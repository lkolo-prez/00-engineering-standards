# Vale prose linter configuration — https://vale.sh
# Run `vale sync` to download the styles below before first use.

StylesPath = .vale/styles
MinAlertLevel = warning

# Download these packages with `vale sync`.
Packages = Microsoft, write-good

Vocab = aircloud

[*.md]
BasedOnStyles = Vale, Microsoft, write-good

# This is technical documentation; relax a few opinionated rules.
Microsoft.Contractions = NO
Microsoft.Headings = suggestion
write-good.Passive = NO
write-good.TooWordy = suggestion

# Don't lint the generated changelog or the legal license text.
[CHANGELOG.md]
BasedOnStyles =

[LICENSE]
BasedOnStyles =

version: 2
updates:
  # Keep GitHub Actions SHA-pinned but up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Dev tooling (markdownlint-cli2 etc.) pulled in via npm.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - npm

  # Dev container base image + features.
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - devcontainer

name: gitleaks

# Secret scanning: fail the build if a secret is committed.
# This repo has no real secrets (OIDC is used org-wide), so this is a defense-in-depth gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly full-history scan

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout (full history for a complete scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          # No license needed for public repos; for private repos set GITLEAKS_LICENSE as a secret.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

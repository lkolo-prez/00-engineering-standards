name: docs-lint

# Lint the handbook: markdownlint (style), lychee (links), vale (prose).
# This is the required status check for PRs to the default branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top; elevate per-job only as needed.
permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0
        with:
          globs: |
            **/*.md
            !LICENSE

      # Vale CLI (pinned + SHA-256) instead of vale-action: the action reports through
      # reviewdog, which needs checks: write and only annotates PR diffs.
      - name: Install Vale CLI (checksum-verified)
        env:
          VALE_VERSION: 3.28.1
          VALE_SHA256: 068954ad869ebec24b8dec6ebcd1cbb1fd5f5a83e966a35baedfae8b2cdc093a
        run: |
          set -euo pipefail
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${tarball}"
          echo "${VALE_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" vale
          "${RUNNER_TEMP}/vale" --version

      - name: Vale prose lint
        run: |
          "${RUNNER_TEMP}/vale" sync
          "${RUNNER_TEMP}/vale" --minAlertLevel=error --output=line \
            docs README.md CATALOG.md CONTRIBUTING.md

  link-check:
    name: link-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          # Link checking reaches arbitrary external hosts; audit egress here.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: lychee link check
        uses: lycheeverse/lychee-action@f81112d0d2814ded911bd23e3beaa9dda9093915 # v2.1.0
        with:
          # Skip example/placeholder hosts that don't resolve.
          args: >-
            --no-progress
            --exclude-mail
            --exclude 'aircloud\.example'
            --exclude 'example\.com'
            --accept 200,206,429
            './**/*.md'
          fail: true

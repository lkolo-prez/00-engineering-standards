name: docs-lint

# Lint the handbook: markdownlint (style), lychee (links), vale (prose).
# This is the required status check for PRs to the default branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege at the top; elevate per-job only as needed.
permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            **/*.md
            !LICENSE

      - name: Vale prose lint
        uses: errata-ai/vale-action@d89dee975228ae261d22c15adcd03578634d429c # v2.1.1
        with:
          files: docs README.md CATALOG.md CONTRIBUTING.md
          fail_on_error: true
          reporter: github-pr-check

  link-check:
    name: link-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          # Link checking reaches arbitrary external hosts; audit egress here.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: lychee link check
        uses: lycheeverse/lychee-action@f81112d0d2814ded911bd23e3beaa9dda9093915 # v2.1.0
        with:
          # Skip example/placeholder hosts that don't resolve.
          args: >-
            --no-progress
            --exclude-mail
            --exclude 'aircloud\.example'
            --exclude 'example\.com'
            --accept 200,206,429
            './**/*.md'
          fail: true
